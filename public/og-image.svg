<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="CivicPulse AI — Citizen voice to bankable public infrastructure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#4338ca" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#f97316"/>

  <!-- Logo -->
  <g transform="translate(96 130) rotate(45)">
    <rect width="120" height="120" rx="8" fill="#f97316" stroke="#fdba74" stroke-width="3"/>
    <circle cx="60" cy="60" r="32" fill="#ffffff"/>
    <circle cx="60" cy="60" r="14" fill="#1e1b4b"/>
  </g>
  <g transform="translate(96 130)">
    <text x="0" y="220" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="2">CIVICPULSE AI</text>
    <text x="0" y="270" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="#fbbf24" letter-spacing="6">DIGITAL PUBLIC GOOD · DPG-OPEN-2026</text>
  </g>

  <!-- Headline -->
  <text x="96" y="430" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="56" font-weight="800" fill="#ffffff">Turn citizen voice into</text>
  <text x="96" y="500" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="56" font-weight="800" fill="#f97316">bankable public infrastructure.</text>

  <!-- Stat strip -->
  <g transform="translate(96 540)" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-weight="700" fill="#c7d2fe">
    <text x="0" y="0" font-size="14" letter-spacing="3" fill="#a5b4fc">10K+ DEMANDS · 48 HOTSPOTS · ₹640CR CAPEX · 9 BANKABLE DPRS</text>
  </g>

  <!-- Pipeline steps -->
  <g transform="translate(700 130)" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
    <rect width="404" height="380" rx="6" fill="#1e1b4b" stroke="#312e81"/>
    <text x="20" y="36" font-size="14" font-weight="800" fill="#fbbf24" letter-spacing="4">4-STAGE AUTONOMOUS PIPELINE</text>

    <g transform="translate(20 60)">
      <rect width="364" height="60" rx="4" fill="#312e81"/>
      <circle cx="30" cy="30" r="14" fill="#f97316"/>
      <text x="60" y="26" font-size="16" font-weight="700" fill="#ffffff">01 · Omnichannel Intake</text>
      <text x="60" y="46" font-size="12" fill="#a5b4fc">IVR · WhatsApp · SMS · CSC kiosks · 13+ languages</text>
    </g>
    <g transform="translate(20 130)">
      <rect width="364" height="60" rx="4" fill="#312e81"/>
      <circle cx="30" cy="30" r="14" fill="#f97316"/>
      <text x="60" y="26" font-size="16" font-weight="700" fill="#ffffff">02 · Spatial Clustering</text>
      <text x="60" y="46" font-size="12" fill="#a5b4fc">DBSCAN hotspot detection · district geocoding</text>
    </g>
    <g transform="translate(20 200)">
      <rect width="364" height="60" rx="4" fill="#312e81"/>
      <circle cx="30" cy="30" r="14" fill="#f97316"/>
      <text x="60" y="26" font-size="16" font-weight="700" fill="#ffffff">03 · Disparity Matrix</text>
      <text x="60" y="46" font-size="12" fill="#a5b4fc">Demand × capex absorption quadrant</text>
    </g>
    <g transform="translate(20 270)">
      <rect width="364" height="60" rx="4" fill="#312e81"/>
      <circle cx="30" cy="30" r="14" fill="#10b981"/>
      <text x="60" y="26" font-size="16" font-weight="700" fill="#ffffff">04 · Bankable DPR</text>
      <text x="60" y="46" font-size="12" fill="#a5b4fc">PIB-format · BoQ · S-ROI · ESG · SDG mapping</text>
    </g>
  </g>

  <!-- Footer line -->
  <g font-family="-apple-system, Segoe UI, Roboto, sans-serif">
    <text x="96" y="600" font-size="14" font-weight="700" fill="#a5b4fc" letter-spacing="3">BECKN · BHASHINI V2 · DPDPA · UN SDG · APACHE-2.0</text>
    <text x="1104" y="600" font-size="14" font-weight="800" fill="#fbbf24" letter-spacing="2" text-anchor="end">civicpulse.ai</text>
  </g>
</svg>
